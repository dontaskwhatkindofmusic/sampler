<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="letter sampler">
<title>letter sampler</title>
<link id="desktopStyle" rel="stylesheet" href="desktop.css">
<link id="touchStyle" rel="stylesheet" href="mobile.css" disabled>
</head>
<body>
<template id="desktopLayout">
<header><h1>letter sampler</h1><a href="?touch=1">touch version</a><label>project [shift+1–4] <select id="project" aria-label="Project"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select></label></header>
<main id="instrument">
<fieldset id="transport"><legend>transport</legend><div class="line"><button id="play">play [space]</button><label>bpm [shift+b] <input id="bpm" type="number" min="30" max="300" value="110"></label><label>steps [shift+l] <select id="length"></select></label><label>step [shift+t] <select id="division"><option value="1">¼ note</option><option value="0.5">⅛ note</option><option value="0.25">¹⁄₁₆ note</option></select></label><label><input id="metro" type="checkbox">click [shift+m]</label><label><input id="overdub" type="checkbox">write live [shift+w]</label><button id="panic">stop all [esc]</button></div></fieldset>
<fieldset id="sequence"><legend>sequence <small id="meter"></small></legend><label>page <select id="stepPage" aria-label="Step page"><option value="0">1–8</option><option value="1">9–16</option><option value="2">17–24</option><option value="3">25–32</option></select></label><div id="steps" class="row"></div><div class="line"><button id="clearSelection">release steps [\]</button><button id="clearPattern">clear pattern [shift+⌫]</button><span class="hint">1–8 + letter = steps · [ / ] = page</span></div></fieldset>
<fieldset id="samples"><legend>samples <small class="hint">· drop audio onto a letter</small></legend><div id="keyboard"></div><div class="line"><button id="record" aria-pressed="false">hold record [`]</button><button id="stopRecord" disabled>finish [shift+enter]</button><label><input id="cycle" type="checkbox">one cycle [shift+c]</label><label><input id="thresholdOn" type="checkbox">threshold [shift+a]</label><label>dBFS [shift+f] <input id="thresholdDb" type="number" min="-80" max="0" step="1" value="-35"></label><span id="inputLevel" class="hint" aria-live="off">input: —</span><button id="deleteMode" aria-pressed="false">delete</button><button id="micCheck">enable microphone</button><button id="demo">drums [shift+d]</button></div></fieldset>
<fieldset id="editor"><legend id="selected">selected: K [←/→]</legend><div class="line"><label>name [shift+n] <input id="sampleName" maxlength="20"></label><button id="import">import audio [shift+i]</button><input id="file" type="file" accept="audio/*" hidden><button id="fxOpen">effects [shift+y]</button><button id="busOpen">master [shift+u]</button><button id="erase">delete [shift+x]</button><button id="undo" disabled>undo [shift+z]</button><label>level [shift+g] <input id="gain" type="range" min="0" max="1.5" step="0.01" value="1"></label><label><input id="reverse" type="checkbox">reverse [shift+v]</label></div><p><label>start [shift+s] <input id="start" type="number" min="0" step="0.01" value="0"></label> <label>end [shift+e] <input id="end" type="number" min="0" step="0.01" value="0"></label> seconds · <span id="size">empty</span></p></fieldset>
</main>
<p id="status" role="status">Tap an empty pad to record; tap again to finish. Hold and release also works.</p>

<footer class="line"><span id="saved">opening local storage…</span><button id="export">export project [shift+p]</button><button id="restore">import project [shift+o]</button><input id="backup" type="file" accept=".json,application/json" hidden></footer>
<details id="help"><summary id="helpToggle">keys & notes [?]</summary><p>Main controls show shortcuts in brackets. Inside dialogs, use Tab, arrow keys and Enter. Master settings open with Shift+U; sample effects with Shift+Y. Shift + letter runs a command; plain letters play samples. ← / → selects a sample without playing it. Field shortcuts focus the value: type or use arrow keys, then Enter to return to playing. Shortcuts pause while editing a field; Esc always stops all audio and leaves the field. Tab moves between controls and Enter activates a focused button. Press ? to open or close these notes. Hold numbers + letter to write steps; press \ to release mouse-selected steps. Shift + Backspace clears the pattern.</p><p>Drop one audio file onto any letter to load or replace its sample. The target key highlights before you drop. Files stay in this browser; imports keep the first 12 seconds. You can also select a letter and use “import audio”.</p><p><kbd>A–Z</kbd> play · <kbd>`</kbd> + letter record while held (12 seconds max) · <kbd>Shift+X</kbd> enter / confirm multi-select delete · <kbd>1–8</kbd> + letter toggle steps · <kbd>Space</kbd> play / stop · <kbd>Shift</kbd> + <kbd>1–4</kbd> project · <kbd>Esc</kbd> stop everything.</p><p>Tap an empty pad to record, or to wait for sound when threshold is enabled. Tap the same pad again to stop or cancel. Or press and hold the empty pad, then release to stop. Capture starts on touch-down; presses lasting 350 ms or more count as holds. No recording delay. Loaded pads still play immediately. To deliberately replace a loaded sample, hold backtick (`), then hold its letter to record. Releasing either key stops capture. With the mouse, hold the record button while holding a letter; alternatively hold backtick and press and hold a letter button. Taps latch recording; holds stop on release. “One cycle” adds a four-beat count-in and limits capture to one sequence length; keep holding throughout. Releasing early always stops. Enable click to hear the metronome; use headphones while recording. “Write live” places played notes on the nearest step while the sequence runs.</p><p>Enable threshold [shift+a] to wait for sound before capturing. Set the trigger with dBFS [shift+f], from −80 to 0 (default −35). More negative values are more sensitive. The live input readout helps choose a value above background noise. This measures digital signal level, not room-volume decibels. A 20 ms pre-roll preserves the attack. Once triggered, capture continues until release or the duration limit; it does not stop during quiet gaps. Releasing before the trigger preserves the previous sample. Threshold changes apply to the next hold.</p><p>Eight quarter-note steps = two bars of 4/4. Use [ / ] or the page menu to select eight of the 32 steps. Number keys 1–8 address the current page. Inactive steps are kept when shortening a pattern. Number chords depend on your keyboard’s rollover; selecting steps with the mouse is an alternative.</p><p>Microphone recordings and imports are limited to 12 seconds and stored as 22.05 kHz mono WAV (about 43 KB per second). Audio is decoded before playing. Actual latency depends on your browser and audio device; wired headphones work best. Recording needs microphone permission and HTTPS or localhost.</p><p>Projects save on this device in this browser. Browser storage can be cleared or evicted; export a backup to keep your work. Samples are never uploaded. Command shortcuts are left to your browser.</p></details>
<dialog id="fxDialog"><h2 id="fxTitle">effects</h2><label>pitch <input id="fxPitch" type="range" min="-24" max="24" step="1" value="0"><output id="pitchValue">0 st</output></label><label>low-pass <input id="fxCutoff" type="range" min="200" max="20000" step="100" value="20000"><output id="cutoffValue">off</output></label><label>pan <input id="fxPan" type="range" min="-1" max="1" step="0.1" value="0"><output id="panValue">center</output></label><label>compressor <select id="fxComp"><option value="0">off</option><option value="4">gentle · 4:1</option><option value="8">firm · 8:1</option><option value="20">limit · 20:1</option></select></label><p>Pitch changes speed too. Changes apply on the next hit.</p><div class="line"><button id="fxReset">reset</button><button id="fxClose">cancel</button><button id="fxApply">apply</button></div></dialog>
<dialog id="busDialog"><h2>master</h2><label>gain <input id="busGain" type="range" min="0" max="1.5" step="0.01"><output id="busGainValue"></output></label><label><input id="busComp" type="checkbox">compressor</label><label>threshold dB <input id="busThreshold" type="range" min="-100" max="0" step="1"><output id="busThresholdValue"></output></label><label>ratio <input id="busRatio" type="range" min="1" max="20" step="0.5"><output id="busRatioValue"></output></label><div class="line"><button id="busClose">cancel</button><button id="busApply">apply</button></div></dialog>
</template>
<template id="touchLayout">
<header><h1>letter sampler</h1><label>project <select id="project" aria-label="Project"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select></label></header>
<div class="transport"><button id="play">play</button><button id="panic">stop all</button><label>bpm <select id="bpm" aria-label="BPM"></select></label></div>
<main>
<section id="view-play" aria-label="Play samples">
<div class="banks" aria-label="Sample banks"><select id="bankSelect" aria-label="Sample bank"><option value="0">bank 1</option><option value="1">bank 2</option><option value="2">bank 3</option></select><button data-bank="0" aria-pressed="true">bank 1</button><button data-bank="1" aria-pressed="false">bank 2</button><button data-bank="2" aria-pressed="false">bank 3</button></div>
<div id="keyboard" aria-label="Sample pads"></div>
<div class="recordbar"><button id="deleteMode" aria-pressed="false">delete</button><button id="record" aria-pressed="false" hidden>record</button><button id="stopRecord" disabled hidden>finish</button><span id="inputLevel" aria-live="off">input: —</span></div>
</section>
<section id="view-sequence" aria-label="Sequence" hidden>
<div class="line"><label>steps <select id="length"></select></label><label>step <select id="division"><option value="1">¼ note</option><option value="0.5">⅛ note</option><option value="0.25">¹⁄₁₆ note</option></select></label></div>
<label>page <select id="stepPage" aria-label="Step page"><option value="0">1–8</option><option value="1">9–16</option><option value="2">17–24</option><option value="3">25–32</option></select></label><div id="steps" aria-label="Sequence steps"></div><small id="meter"></small>
<div class="line"><button id="clearSelection">release steps</button><button id="clearPattern">clear pattern</button></div>
<p class="instruction">Select steps, then tap a sample in Play. Tap again to remove it.</p>
</section>
<section id="view-sample" aria-label="Sample editor" hidden>
<div class="line"><button id="previous" aria-label="Previous sample">←</button><strong id="selected">selected: K</strong><button id="next" aria-label="Next sample">→</button></div>
<label>name <input id="sampleName" maxlength="20"></label>
<div class="line"><button id="import">audio from Files</button><button id="audition">listen</button><button id="fxOpen">FX</button></div><input id="file" type="file" accept="audio/*" hidden>
<div class="line"><label>level <input id="gain" type="range" min="0" max="1.5" step="0.01" value="1"></label><label><input id="reverse" type="checkbox">reverse</label></div>
<div class="line"><label>start <input id="start" type="number" min="0" step="0.01" value="0"></label><label>end <input id="end" type="number" min="0" step="0.01" value="0"></label></div>
<div class="line"><button id="erase">delete</button><button id="undo" disabled>undo</button><span id="size">empty</span></div>
</section>
<section id="view-setup" aria-label="Recording and project settings" hidden>
<div class="line"><label><input id="metro" type="checkbox">click</label><label><input id="overdub" type="checkbox">write live</label><label><input id="cycle" type="checkbox">one cycle</label></div>
<div class="line"><label><input id="thresholdOn" type="checkbox">threshold</label><label>dBFS <input id="thresholdDb" type="number" min="-80" max="0" step="1" value="-35"></label></div>
<div class="line"><button id="micCheck">check microphone</button><button id="demo">K / S / H drums</button></div>
<div class="line"><button id="export">export project</button><button id="restore">import project</button></div><input id="backup" type="file" accept=".json,application/json" hidden>
<small id="saved">opening local storage…</small>
<div class="line"><button id="busOpen">master FX</button><button id="helpToggle">help</button><a href="?desktop=1">desktop view</a></div>
</section>
</main>
<p id="status" role="status">Tap a pad. Add drums in Setup, or import in Sample.</p>
<nav aria-label="Instrument views"><button data-view="play" aria-pressed="true">play</button><button data-view="sequence" aria-pressed="false">steps</button><button data-view="sample" aria-pressed="false">sample</button><button data-view="setup" aria-pressed="false">setup</button></nav>
<dialog id="fieldDialog"><form method="dialog"><label id="fieldTitle" for="fieldValue">value</label><input id="fieldValue" autocomplete="off"><div class="line"><button value="cancel">cancel</button><button id="fieldApply" value="apply">set</button></div></form></dialog>
<dialog id="help"><h2 id="helpTitle">playing</h2><p id="helpText"></p><div class="line"><button id="helpPrev">←</button><span id="helpPage"></span><button id="helpNext">→</button><button id="helpClose">done</button></div></dialog>
<dialog id="fxDialog"><h2 id="fxTitle">effects</h2><label>pitch <input id="fxPitch" type="range" min="-24" max="24" step="1" value="0"><output id="pitchValue">0 st</output></label><label>low-pass <input id="fxCutoff" type="range" min="200" max="20000" step="100" value="20000"><output id="cutoffValue">off</output></label><label>pan <input id="fxPan" type="range" min="-1" max="1" step="0.1" value="0"><output id="panValue">center</output></label><label>compressor <select id="fxComp"><option value="0">off</option><option value="4">gentle · 4:1</option><option value="8">firm · 8:1</option><option value="20">limit · 20:1</option></select></label><p>Pitch changes speed too. Changes apply on the next hit.</p><div class="line"><button id="fxReset">reset</button><button id="fxClose">cancel</button><button id="fxApply">apply</button></div></dialog>
<dialog id="busDialog"><h2>master</h2><label>gain <input id="busGain" type="range" min="0" max="1.5" step="0.01"><output id="busGainValue"></output></label><label><input id="busComp" type="checkbox">compressor</label><label>threshold dB <input id="busThreshold" type="range" min="-100" max="0" step="1"><output id="busThresholdValue"></output></label><label>ratio <input id="busRatio" type="range" min="1" max="20" step="0.5"><output id="busRatioValue"></output></label><div class="line"><button id="busClose">cancel</button><button id="busApply">apply</button></div></dialog>
</template>
<script src="layout.js"></script>
<script src="sampler.js"></script>
<script src="mobile.js"></script>
<script src="controls.js"></script>
<noscript>This instrument needs JavaScript for audio and recording.</noscript>
</body>
</html>
